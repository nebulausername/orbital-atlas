    # ================================================================
    # ORBITAL ATLAS unter /orbital-atlas (statischer Vite-Bau, keine App)
    #   Dateien:      /var/www/orbital-atlas  (www-data darf /root nicht lesen)
    #   Sollfassung:  /root/projects/orbital-atlas/deploy/nginx-abschnitt.conf
    #   Ausliefern:   /root/projects/orbital-atlas/deploy/ausliefern.sh
    #
    # `^~` gewinnt gegen die Regex-locations oben (Endungsriegel). Jedes
    # `add_header` verwirft die geerbten Server-Header → hier wiederholt.
    # Gecacht wird nach VERZEICHNIS, nie nach Endung (Betriebsregel 20b).
    # ================================================================
    location = /orbital-atlas {
        return 301 /orbital-atlas/;
    }
    location ^~ /orbital-atlas/assets/ {
        alias /var/www/orbital-atlas/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
    location ^~ /orbital-atlas/ {
        alias /var/www/orbital-atlas/;
        index index.html;
        try_files $uri $uri/ =404;
        # Karten und Daten tragen keinen Hash: einen Tag cachen, dann nachfragen
        add_header Cache-Control "public, max-age=86400, must-revalidate" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'self'" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }
    location = /orbital-atlas/index.html {
        alias /var/www/orbital-atlas/index.html;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'self'" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
